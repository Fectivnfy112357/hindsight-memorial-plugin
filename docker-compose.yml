# docker-compose.yml — webhook receiver for hindsight-memorial.
#
# This file is the deployment manifest for the *memorial* container only. The
# Hindsight server itself runs in a sibling project directory (e.g.
# /www/dk_project/dk_app/hindsight/) under its own docker-compose.yml and is
# NEVER modified by this repo.
#
# The image is built from this directory (see ../Dockerfile); the source
# tree is COPYed into the image at build time, so a host bind-mount of the
# source is NOT required. Only `./data/logs` is bind-mounted so log files
# land in the project directory and survive container restarts.
#
# Networking: this service joins the existing hindsight_default network so
# it can resolve the host name "hindsight" and reach the Hindsight API at
# http://hindsight:8888 (the container-internal port, NOT the 9600 host port).
#
# Persistence: the reconciler state lives in the *host's* existing MySQL
# (decided 2026-08-01), not in a sidecar container. The container reaches it
# through the `host.docker.internal` → host-gateway mapping below; the host's
# ufw must allow the hindsight_default subnet (172.23.0.0/16) to reach 3306.

services:
  memorial:
    build:
      context: .
      args:
        MEMORIAL_PORT: "9602"
    image: hindsight-memorial:local
    container_name: hindsight-memorial
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      # Resolves to the docker bridge gateway, i.e. the host running dockerd.
      - "host.docker.internal:host-gateway"
    environment:
      # Internal address — the host:9600 mapping is only for browsers /
      # external clients; inside the docker network we use the container name.
      HINDSIGHT_API_URL: "http://hindsight:8888"
      HINDSIGHT_MEMORIAL_LOG_FILE: "/data/logs/hindsight-memorial.log"
      HINDSIGHT_MEMORIAL_LOG_LEVEL: "INFO"
      MEMORIAL_PORT: "9602"
      # Persistence backend — the host's MySQL. Unset HINDSIGHT_MYSQL_HOST
      # to fall back to the SQLite "ingest-only" mode.
      HINDSIGHT_MYSQL_HOST: "${HINDSIGHT_MYSQL_HOST:-host.docker.internal}"
      HINDSIGHT_MYSQL_PORT: "${HINDSIGHT_MYSQL_PORT:-3306}"
      HINDSIGHT_MYSQL_USER: "${HINDSIGHT_MYSQL_USER:-memorial}"
      HINDSIGHT_MYSQL_PASSWORD: "${HINDSIGHT_MYSQL_PASSWORD:?must set in .env}"
      HINDSIGHT_MYSQL_DATABASE: "${HINDSIGHT_MYSQL_DATABASE:-hindsight_memorial}"
      HINDSIGHT_POLLER_ENABLED: "1"
      HINDSIGHT_POLLER_INTERVAL_SEC: "1"
    volumes:
      # Logs — bind-mounted so they survive container rebuilds.
      - ./data/logs:/data/logs
    networks:
      - hindsight_net
    # No `ports:` — the receiver is reached only via the docker network from
    # the hindsight container. To debug locally:
    #   docker compose run --service-ports memorial   # then localhost:9602

networks:
  hindsight_net:
    # Join the existing network created by the hindsight project so we can
    # resolve the `hindsight` host name. The name below must match the
    # compose project name + "_default" of the hindsight project. If you
    # renamed that project, update `name:` accordingly.
    external: true
    name: hindsight_default
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-memorial"
version = "0.1.0"
description = "Webhook-driven pollution cleanup for Hindsight memories. Receives retain.completed events and runs a per-memory_unit reflect + curate pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Stdlib-only by design — no third-party deps. The webhook server uses
# http.server.ThreadingHTTPServer, the HTTP client uses urllib, HMAC uses hashlib.
dependencies = []
authors = [{ name = "贾晓源" }]
keywords = ["hindsight", "memory", "agent", "cleanup", "pollution", "webhook"]

[project.scripts]
# Lets users run `hindsight-memorial-webhook --port 9601 --secret ...`
# after `pip install .`.
hindsight-memorial-webhook = "hindsight_memorial.webhook_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hindsight_memorial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
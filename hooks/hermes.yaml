# Hermes plugin install instructions for hindsight-memorial.
#
# This file is a reference — the actual hook now runs via the Hermes plugin
# system (see hermes/plugin.yaml + hermes/__init__.py). The plugin registers
# a post_tool_call hook that fires after every hindsight_retain invocation.
#
# Quick install:
#   1. Symlink (or copy) the hermes/ directory to ~/.hermes/plugins/hindsight-memorial/
#   2. Enable the plugin:  hermes plugins enable hindsight-memorial
#   3. Restart Hermes (or /reset)
#
# Old shell-hook config (kept for reference; plugin is preferred):
# hooks:
#   post_tool_call:
#     - matcher: "hindsight_retain|agent_knowledge_ingest"
#       command: "python3 /path/to/hindsight-memorial/scripts/retain_reflect_curate.py"
#       timeout: 60